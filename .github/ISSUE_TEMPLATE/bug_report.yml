name: Bug report
description: Report reproducible incorrect behavior in Omawix
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security issues, use the private process described in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Omawix version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Omarchy version and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
